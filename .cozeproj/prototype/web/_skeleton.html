<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts: Playfair Display (serif headings) + Noto Serif SC (CN headings) + Inter (body) -->
  <link href="https://fonts.googleapis.cn/css2?family=Playfair+Display:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #2C2C2C;
      --color-primary-container:    #3D3D3D;
      --color-on-primary:           #F5F0EB;
      /* === 背景 / 表面 === */
      --color-background:                 #F5F0EB;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FFFFFF;
      --color-surface-container:          #EDEBE8;
      --color-surface-container-high:     #E5E2DD;
      --color-surface-container-highest:  #DDD9D4;
      /* === 文字 === */
      --color-on-surface:           #2C2C2C;
      --color-on-surface-variant:   #7A756E;
      /* === 功能色 === */
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      /* === 品牌点缀色 === */
      --color-ochre:       #B8956A;
      --color-ochre-light: #D4B896;
      --color-ochre-dark:  #96754E;
      /* === 边框 === */
      --color-outline:          #D9D4CE;
      --color-outline-variant:  #E5E2DD;
      /* === 圆角 (max 6px per DESIGN.md) === */
      --radius-sm:   0.125rem;
      --radius-md:   0.25rem;
      --radius-lg:   0.375rem;
      --radius-xl:   0.5rem;
      --radius-2xl:  0.75rem;
      --radius-full: 9999px;
      /* === 阴影 (max 2px blur per DESIGN.md) === */
      --shadow-card:   0 1px 2px rgba(0,0,0,0.08);
      --shadow-float:  0 2px 2px rgba(0,0,0,0.1);
      --shadow-dialog: 0 2px 2px rgba(0,0,0,0.12);
      /* === 字体 === */
      --font-sans: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-serif: "Playfair Display", "Noto Serif SC", ui-serif, Georgia, serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start 导航组件，不需要的页面则不要复制此段 -->
  <header class="bg-surface/95 backdrop-blur-sm sticky top-0 z-40 border-b border-outline-variant/30">
    <div class="max-w-7xl mx-auto h-16 flex items-center justify-between px-6">
      <!-- Logo -->
      <a href="home.html" class="flex items-center gap-3">
        <span class="font-serif text-xl font-semibold tracking-wide text-on-surface">CHENGFENG</span>
        <span class="text-xs text-on-surface-variant tracking-widest uppercase">International</span>
      </a>
      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center gap-8">
        <a href="home.html" class="text-sm font-medium text-on-surface-variant hover:text-on-surface transition-colors tracking-wide">Home</a>
        <a href="products.html" class="text-sm font-medium text-on-surface-variant hover:text-on-surface transition-colors tracking-wide">Collections</a>
        <a href="about.html" class="text-sm font-medium text-on-surface-variant hover:text-on-surface transition-colors tracking-wide">About</a>
        <a href="inquiry.html" class="text-sm font-medium text-on-surface-variant hover:text-on-surface transition-colors tracking-wide">Inquiry</a>
      </nav>
      <!-- CTA + Mobile -->
      <div class="flex items-center gap-4">
        <a href="inquiry.html" class="hidden md:inline-flex bg-ochre text-white px-5 py-2 text-sm font-medium tracking-wide hover:bg-ochre-dark transition-colors" style="border-radius: var(--radius-lg);">Get Quote</a>
        <!-- Mobile menu button -->
        <button id="mobile-menu-btn" class="md:hidden text-on-surface" aria-label="Menu">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
      </div>
    </div>
    <!-- Mobile Nav -->
    <div id="mobile-menu" class="md:hidden hidden border-t border-outline-variant/30 bg-surface">
      <nav class="flex flex-col px-6 py-4 gap-4">
        <a href="home.html" class="text-sm font-medium text-on-surface-variant hover:text-on-surface transition-colors">Home</a>
        <a href="products.html" class="text-sm font-medium text-on-surface-variant hover:text-on-surface transition-colors">Collections</a>
        <a href="about.html" class="text-sm font-medium text-on-surface-variant hover:text-on-surface transition-colors">About</a>
        <a href="inquiry.html" class="text-sm font-medium text-on-surface-variant hover:text-on-surface transition-colors">Inquiry</a>
        <a href="inquiry.html" class="bg-ochre text-white px-5 py-2 text-sm font-medium tracking-wide text-center hover:bg-ochre-dark transition-colors" style="border-radius: var(--radius-lg);">Get Quote</a>
      </nav>
    </div>
  </header>
  <!-- @nav:end 导航组件，不需要的页面则不要复制此段 -->

  <main class="max-w-7xl mx-auto">
    <!-- @main-content:start -->
    <!-- @main-content:end -->
  </main>

  <script>
    // Mobile menu toggle
    $('#mobile-menu-btn').on('click', function() {
      $('#mobile-menu').toggleClass('hidden');
    });
    // Set active nav link based on current page
    $(function() {
      const page = window.location.pathname.split('/').pop() || 'home.html';
      $('header nav a, #mobile-menu nav a').each(function() {
        const href = $(this).attr('href');
        if (href === page || (page === '' && href === 'home.html')) {
          $(this).removeClass('text-on-surface-variant').addClass('text-on-surface');
          if ($(this).closest('#mobile-menu').length === 0 && !$(this).hasClass('bg-ochre')) {
            $(this).css('border-bottom', '2px solid var(--color-ochre)').css('padding-bottom', '2px');
          }
        }
      });
    });
  </script>
  <script>lucide.createIcons();</script>
</body>

</html>
